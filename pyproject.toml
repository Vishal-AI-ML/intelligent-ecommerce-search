[project]
name = "ecommerce-search"
version = "0.1.0"
description = "Intelligent e-commerce search and bounded-decision engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.0",
    "torch>=2.14.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "psutil>=7.2.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

# Milestone 4: torch comes only from the official CPU-only wheel index on every platform, so
# Linux/Docker never pulls CUDA wheels. `explicit = true` keeps every other package on PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_search"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a running PostgreSQL with pgvector (docker compose up -d db)",
]
